<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">From Angular to React Native</title>
  <desc id="desc">An illustration showing Angular web development concepts crossing a bridge to React Native iOS and Android development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f5fbf7"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="92" r="128" fill="#dff7ee" opacity="0.8"/>
  <circle cx="160" cy="430" r="140" fill="#dbeafe" opacity="0.8"/>

  <g filter="url(#shadow)">
    <rect x="58" y="66" width="320" height="344" rx="28" fill="#fff"/>
    <rect x="822" y="66" width="320" height="344" rx="28" fill="#fff"/>
  </g>

  <g transform="translate(92 100)">
    <path d="M68 0 132 24 121 132 68 164 15 132 4 24Z" fill="#dd0031"/>
    <path d="M68 18 68 142 108 119 117 35Z" fill="#c3002f" opacity=".9"/>
    <text x="68" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="800" fill="#fff">A</text>
    <text x="160" y="34" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#0f172a">Angular</text>
    <text x="160" y="66" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">The concepts you already know</text>
    <g font-family="Inter,Arial,sans-serif" font-size="18" fill="#1e293b">
      <rect x="0" y="198" width="250" height="42" rx="12" fill="#f8fafc"/><text x="18" y="225">Components + templates</text>
      <rect x="0" y="248" width="250" height="42" rx="12" fill="#f8fafc"/><text x="18" y="275">Signals + computed</text>
      <rect x="0" y="298" width="250" height="42" rx="12" fill="#f8fafc"/><text x="18" y="325">Router + services + state</text>
    </g>
  </g>

  <g transform="translate(850 102)">
    <text x="132" y="26" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#0f172a">React Native</text>
    <text x="132" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Same engineering, native runtime</text>
    <g transform="translate(15 92)">
      <rect width="104" height="180" rx="25" fill="#111827"/>
      <rect x="8" y="13" width="88" height="154" rx="18" fill="#e0f2fe"/>
      <circle cx="52" cy="146" r="6" fill="#94a3b8"/>
      <text x="52" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#0f172a">iOS</text>
    </g>
    <g transform="translate(145 92)">
      <rect width="104" height="180" rx="25" fill="#111827"/>
      <rect x="8" y="13" width="88" height="154" rx="18" fill="#dcfce7"/>
      <circle cx="52" cy="146" r="6" fill="#94a3b8"/>
      <text x="52" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#0f172a">Android</text>
    </g>
    <g font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">
      <text x="4" y="312">Native UI · offline · device APIs</text>
    </g>
  </g>

  <g>
    <path d="M390 320 C515 190 685 190 810 320" fill="none" stroke="url(#bridge)" stroke-width="46" stroke-linecap="round"/>
    <path d="M390 320 C515 190 685 190 810 320" fill="none" stroke="#fff" stroke-opacity=".36" stroke-width="4"/>
    <circle cx="600" cy="235" r="74" fill="#fff" filter="url(#shadow)"/>
    <text x="600" y="226" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#0f172a">Mental model</text>
    <text x="600" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">maps surprisingly well</text>
  </g>

  <text x="600" y="474" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">Same developer. Different rendering model. A bigger runtime.</text>
</svg>