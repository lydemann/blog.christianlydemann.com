<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Angular computed versus React re-render</title>
  <desc id="desc">A side by side comparison of Angular Signals dependency tracking and React component re-rendering.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7f8"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#eefaff"/></linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0284c7"/></marker>
  </defs>
  <rect width="1200" height="650" rx="34" fill="url(#bg2)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f172a">computed() vs re-render</text>
  <text x="600" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#64748b">Similar outcome. Different mechanics.</text>
  <g filter="url(#s2)"><rect x="64" y="126" width="505" height="452" rx="28" fill="#fff"/><rect x="631" y="126" width="505" height="452" rx="28" fill="#fff"/></g>

  <g font-family="Inter,Arial,sans-serif">
    <text x="104" y="176" font-size="25" font-weight="800" fill="#b91c1c">Angular Signals</text>
    <text x="104" y="203" font-size="16" fill="#64748b">Fine-grained dependency tracking</text>
    <rect x="108" y="238" width="170" height="55" rx="15" fill="#fee2e2"/><text x="193" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">firstName signal</text>
    <rect x="350" y="238" width="170" height="55" rx="15" fill="#fee2e2"/><text x="435" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">lastName signal</text>
    <line x1="193" y1="296" x2="294" y2="346" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowA)"/>
    <line x1="435" y1="296" x2="334" y2="346" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowA)"/>
    <rect x="218" y="350" width="194" height="62" rx="18" fill="#fecaca"/><text x="315" y="388" text-anchor="middle" font-size="19" font-weight="800" fill="#7f1d1d">computed()</text>
    <line x1="315" y1="414" x2="315" y2="466" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowA)"/>
    <rect x="218" y="472" width="194" height="58" rx="17" fill="#f8fafc"/><text x="315" y="507" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">consumer updates</text>
    <text x="104" y="555" font-size="15" fill="#64748b">Angular knows exactly what the computed value depends on.</text>

    <text x="671" y="176" font-size="25" font-weight="800" fill="#0369a1">React / React Native</text>
    <text x="671" y="203" font-size="16" fill="#64748b">Re-run the component and recalculate</text>
    <rect x="676" y="238" width="414" height="58" rx="16" fill="#e0f2fe"/><text x="883" y="273" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">setFirstName('Chris')</text>
    <line x1="883" y1="299" x2="883" y2="347" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowR)"/>
    <rect x="676" y="352" width="414" height="62" rx="18" fill="#bae6fd"/><text x="883" y="379" text-anchor="middle" font-size="18" font-weight="800" fill="#075985">component function runs again</text><text x="883" y="401" text-anchor="middle" font-size="14" fill="#0c4a6e">props + state describe the next UI</text>
    <line x1="883" y1="417" x2="883" y2="465" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowR)"/>
    <rect x="676" y="470" width="414" height="60" rx="17" fill="#f0f9ff"/><text x="883" y="495" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">fullName recalculates</text><text x="883" y="516" text-anchor="middle" font-size="14" fill="#0369a1">React reconciles the UI</text>
    <text x="671" y="555" font-size="15" fill="#64748b">No dependency tracking for the local derived variable is needed.</text>
  </g>
  <rect x="250" y="598" width="700" height="34" rx="17" fill="#ecfdf5"/>
  <text x="600" y="621" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">Best practice: derive cheap values during render instead of syncing derived state with useEffect.</text>
</svg>